[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erw"
version = "0.1.0"
description = "Early Risk Web backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy>=2",
  "apscheduler>=3.10,<4",
  "httpx",
  "tenacity",
  "numpy",
  "early-risk-detection",
  "pandas",
  "duckdb",
]

[project.optional-dependencies]
dev = ["pytest", "respx", "ruff"]

[project.scripts]
erw = "erw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["erw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "E741", "B905"]
