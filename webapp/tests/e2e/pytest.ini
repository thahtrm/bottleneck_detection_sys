[pytest]
testpaths = api scenarios
pythonpath = . ../../backend
norecursedirs = ui __pycache__ .pytest_cache node_modules .venv
addopts = -ra --strict-markers
markers =
    tier1: Tier 1 isolated happy-path feature tests
    tier2: Tier 2 boundary, negative, and corner-case tests
    tier3: Tier 3 cross-feature pairwise integration tests
    tier4: Tier 4 real-world multi-step product workflow scenarios
    feature(id): Links test case to PROJECT.md feature ID (F01..F31)
    api: REST API E2E tests
    cli: CLI subprocess E2E tests
    scenario: Cross-feature / multi-step scenario tests
    dual_mode: Tests exercising both local and jira_cloud modes
    erw_ml: ERW AI/ML and DuckDB ETL compatibility tests
filterwarnings =
    ignore::DeprecationWarning
